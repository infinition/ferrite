name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The MSVC target is required so build.rs can embed the icon through the
      # Windows SDK resource compiler.
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Compute checksum
        shell: pwsh
        run: |
          $path = "target/x86_64-pc-windows-msvc/release/Ferrite.exe"
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          "$hash  Ferrite.exe" | Out-File -Encoding ascii Ferrite.exe.sha256
          Write-Host "SHA256 $hash"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/Ferrite.exe
            Ferrite.exe.sha256
          generate_release_notes: true
