name: New detection rule
description: Propose an artifact Ferrite should recognise
labels: [rule]
body:
  - type: input
    id: pattern
    attributes:
      label: Directory or file name
      placeholder: .turbo
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Tool that produces it
      placeholder: Turborepo
    validations:
      required: true

  - type: input
    id: restore
    attributes:
      label: Command that regenerates it
      placeholder: npm run build
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - Safe, pure build artifact
        - Review, may hold sources in some projects
        - Data, re-downloadable weights or cache
    validations:
      required: true

  - type: input
    id: marker
    attributes:
      label: Sibling marker file, if the name is ambiguous
      description: >
        A name such as `target` or `vendor` means different things per
        ecosystem. Naming a marker file that must sit next to it keeps the rule
        from firing on unrelated projects.
      placeholder: turbo.json

  - type: input
    id: ignore
    attributes:
      label: Pattern to write into .gitignore
      placeholder: .turbo/
