[package]
name = "ferrite"
version = "1.0.0"
edition = "2021"
description = "Inventaire et nettoyage des artefacts regenerables d'un workspace"
authors = ["infinition"]

[dependencies]
tiny_http = "0.12"
serde_json = "1"
# tao et wry sont la couche fenetre et webview de Tauri, utilisees seules:
# fenetre native WebView2, binaire unique, aucune chaine d'outils JavaScript.
tao = "0"
wry = "0"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
