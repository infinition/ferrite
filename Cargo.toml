[package]
name = "ferrite"
version = "1.1.0"
edition = "2021"
description = "Desktop app that inventories and cleans regenerable build artifacts across a workspace"
authors = ["infinition"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/infinition/ferrite"
keywords = ["cleanup", "disk-space", "build-artifacts", "gitignore", "workspace"]
categories = ["command-line-utilities", "development-tools"]

# Capitalised on purpose: this is the name users see in Explorer and in the
# taskbar, so the produced binary is Ferrite.exe rather than ferrite.exe.
[[bin]]
name = "Ferrite"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde_json = "1"
# tao et wry sont la couche fenetre et webview de Tauri, utilisees seules:
# fenetre native WebView2, binaire unique, aucune chaine d'outils JavaScript.
tao = "0"
wry = "0"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
